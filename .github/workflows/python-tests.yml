name: AI3D Python tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and test (no AI dependencies)
        run: |
          python -m compileall -q ai3d space_nova_pipeline tests
          python -m unittest discover -s tests -v
          python space_nova_pipeline/space_nova_pipeline.py --help >/dev/null
